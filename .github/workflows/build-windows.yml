name: CScore pile PoC Windows

# Manual only: does not spend GitHub Actions minutes on every commit.
on:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK (CI runner only)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout pinned OpenCS source
        shell: pwsh
        run: |
          $lock = Get-Content config/opencs.lock.json -Raw | ConvertFrom-Json
          $pin = $lock.commit
          if ($pin.Length -ne 40 -or $pin -notmatch '^[a-f0-9]{40}$') {
            throw 'Invalid SHA in upstream lock file'
          }
          git clone https://github.com/rumata-ap/OpenCS.git vendor/OpenCS
          git -C vendor/OpenCS checkout --detach $pin
          if ((git -C vendor/OpenCS rev-parse HEAD).Trim() -ne $pin) { throw 'Wrong upstream commit' }
          python tools/apply_opencs_patches.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CScore patch failed' }
      - name: Python contract tests (no calculated numbers)
        run: python -m unittest discover -s tests -v
      - name: CScore upstream tests (ULS + geometry + cracks)
        shell: pwsh
        run: |
          dotnet test vendor/OpenCS/CScore.Tests/CScore.Tests.csproj -c Release `
            --filter 'FullyQualifiedName~Sp63Normal|FullyQualifiedName~CrackWidthSolver|FullyQualifiedName~Sp63Shear' `
            --logger 'console;verbosity=normal'
      - name: CScore adapter material integration tests
        shell: pwsh
        run: |
          dotnet test tests/CScorePileRunner.Tests/CScorePileRunner.Tests.csproj -c Release `
            --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw 'CScore adapter integration tests failed' }
      - name: Publish portable Windows runner
        shell: pwsh
        run: |
          dotnet publish src/CScorePileRunner/CScorePileRunner.csproj -c Release `
            -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish
      - name: Agreed crack method numeric and product-report regression
        run: python tools/verify_agreed_crack_method.py --runner publish/CScorePileRunner.exe
      - name: Two-plane member eccentricity and source shear regression
        run: python tools/verify_member_eccentricity.py --runner publish/CScorePileRunner.exe
      - name: End-to-end numerical run (real CScore, no mocks)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python pile_rebar.py examples/demo_bns.json `
            --runner publish/CScorePileRunner.exe `
            --output results/pile_results.json `
            --csv results/pile_results.csv
          if ($LASTEXITCODE -ne 0) { throw 'Integration run failed' }
          python -c "import json; r=json.load(open('results/pile_results.json', encoding='utf-8')); assert r['cases'] and all(c['status'] in ('pass_uls','fail_uls','indeterminate') for c in r['cases']); assert any(c['status'] != 'indeterminate' for c in r['cases']), 'All CScore cases are indeterminate'; print('cases', len(r['cases']))"
      - name: Independent benchmark BNS 800 and 1000 (ULS section only)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($case in @('P800_reference', 'P1000_reference', 'P800_search', 'P1000_search')) {
            python pile_rebar.py "examples/verification/$case.json" `
              --runner publish/CScorePileRunner.exe `
              --output "results/$case.json" `
              --csv "results/$case.csv"
            if ($LASTEXITCODE -ne 0) { throw "Benchmark $case failed" }
            python -c "import json,sys,collections; d=json.load(open(sys.argv[1],encoding='utf-8')); c=collections.Counter(x['status'] for x in d['cases']); print(sys.argv[1], dict(c)); assert c['pass_uls']+c['fail_uls']>0, 'No valid CScore calculation'" "results/$case.json"
            if ($LASTEXITCODE -ne 0) { throw "Benchmark $case has no valid numerical result" }
          }
      - name: ARBAT-matched reference cases (two material-strength assumptions)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($d in @('P800', 'P1000')) {
            foreach ($mode in @('nominal', 'gamma09_sensitivity')) {
              $case = "${d}_${mode}"
              python pile_rebar.py "examples/verification/arbat_matched/$case.json" `
                --runner publish/CScorePileRunner.exe `
                --output "results/$case.json" `
                --csv "results/$case.csv"
              if ($LASTEXITCODE -ne 0) { throw "ARBAT benchmark $case failed" }
            }
          }
          python tools/compare_arbat.py --results-dir results --output results/arbat_comparison.csv
          if ($LASTEXITCODE -ne 0) { throw 'ARBAT/CScore comparison failed' }
      - name: Pure bending and fixed-axial checks prepared for companion ARBAT SAV reports
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          foreach ($section in @('P800', 'P1000')) {
            python pile_rebar.py "examples/verification/diagnostic_forces/${section}_NM8.json" `
              --runner publish/CScorePileRunner.exe `
              --output "results/${section}_NM8.json" `
              --csv "results/${section}_NM8.csv"
            if ($LASTEXITCODE -ne 0) { throw "N-M diagnostic $section failed" }
          }
      - name: Explain ARBAT/CScore discrepancies (geometry, gamma, eccentricity, factor)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/diagnose_arbat_inputs.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic input generation failed' }
          New-Item -ItemType Directory results/diagnostics -Force | Out-Null
          Copy-Item examples/verification/diagnostics/manifest.json results/diagnostics/
          $cases = Get-ChildItem examples/verification/diagnostics/P*.json
          foreach ($entry in $cases) {
            python pile_rebar.py $entry.FullName `
              --runner publish/CScorePileRunner.exe `
              --output "results/diagnostics/$($entry.BaseName).json" `
              --csv "results/diagnostics/$($entry.BaseName).csv"
            if ($LASTEXITCODE -ne 0) { throw "Diagnostic $($entry.Name) failed" }
          }
          python tools/diagnose_arbat_compare.py
          if ($LASTEXITCODE -ne 0) { throw 'Discrepancy analysis incomplete' }
      - name: ARBAT v2 cross-validation of accidental eccentricity on independent N-M loads
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/arbat_v2_benchmark.py --prepare-inputs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate ARBAT v2 eccentricity checks' }
          foreach ($d in @('P800', 'P1000')) {
            python pile_rebar.py "examples/verification/diagnostic_forces/${d}_NM8_ea.json" `
              --runner publish/CScorePileRunner.exe `
              --output "results/${d}_NM8_ea.json" `
              --csv "results/${d}_NM8_ea.csv"
            if ($LASTEXITCODE -ne 0) { throw "Failed ARBAT v2 eccentricity case $d" }
          }
          python tools/arbat_v2_benchmark.py --results-dir results --output-csv results/arbat_v2_comparison.csv
          if ($LASTEXITCODE -ne 0) { throw 'ARBAT v2 numerical benchmark incomplete' }
      - name: Experimental circular pile crack-width probe (never design-approved)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/run_crack_research.py --runner publish/CScorePileRunner.exe --output-dir results/crack_probe
          if ($LASTEXITCODE -ne 0) { throw 'Experimental crack probe failed to complete' }
          python -c "import csv; p='results/crack_probe/crack_width_comparison.csv'; r=list(csv.DictReader(open(p,encoding='utf-8-sig'),delimiter=';')); assert len(r)==16; assert all(x['design_status']=='NOT_VERIFIED' for x in r); print('crack probe records',len(r),'research only')"
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete or unsafe crack probe output' }
      - name: Native CScore SLS available in regular pile_rebar workflow
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python pile_rebar.py examples/verification/P800_sls_preselection_example.json `
            --runner publish/CScorePileRunner.exe `
            --output results/P800_sls_research.json `
            --csv results/P800_sls_research.csv
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary BNS + optional SLS mode failed' }
          python -c "import json; a=json.load(open('results/P800_sls_research.json',encoding='utf-8')); assert a['cases'] and a['cases'][0]['sls_gate']=='calculated_uls_pass' and len(a['cases'][0]['sls_probe'])==4; s=a['cases'][0]['sls_probe']; assert all(x['design_status']=='NOT_VERIFIED' for x in s); assert all(x.get('preliminary_method')=='arbat_conservative' for x in s if x['status']=='research_calculated'); print('preliminary SLS cases',len(s))"
          if ($LASTEXITCODE -ne 0) { throw 'SLS mode default or fail-closed contract invalid' }
      - name: "ULS-first rejection test (real CScore - no SLS for overloaded pile)"
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import json; d=json.load(open('examples/verification/P800_sls_preselection_example.json',encoding='utf-8')); d['loads']=[{'id':'OVERLOAD_ULS','n_kn':0,'mx_knm':50000,'my_knm':0}]; json.dump(d,open('results/P800_overload_uls_first_input.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare independent ULS overload test' }
          python pile_rebar.py results/P800_overload_uls_first_input.json `
            --runner publish/CScorePileRunner.exe `
            --output results/P800_overload_uls_first_output.json `
            --csv results/P800_overload_uls_first_output.csv
          if ($LASTEXITCODE -ne 0) { throw 'ULS-first overloaded candidate test failed' }
          python -c "import json; j=json.load(open('results/P800_overload_uls_first_output.json',encoding='utf-8')); assert j['force_basis']=={'uls':'design','sls':'normative'}; assert j['cases']; assert all(c['status'] in ('fail_uls','indeterminate') and c['sls_probe'] is None and c['sls_status'].startswith('not_evaluated_uls_') and c['sls_gate'] in ('skipped_uls_fail','skipped_uls_indeterminate') for c in j['cases']),j['cases']; assert j['selected_preliminary_uls_sls_research_candidate'] is None; print('real engine safely skipped SLS for',len(j['cases']),'overloaded candidates')"
          if ($LASTEXITCODE -ne 0) { throw 'Overloaded candidate must not run SLS or receive PASS' }
      - name: Multi-geometry SLS research matrix (rectangles and circular sections)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/cross_section_sls_matrix.py --runner publish/CScorePileRunner.exe --out results/sls_matrix
          if ($LASTEXITCODE -ne 0) { throw 'Multi-geometry SLS matrix failed' }
          python -c "import csv; p='results/sls_matrix/cross_section_sls_matrix.csv'; r=list(csv.DictReader(open(p,encoding='utf-8-sig'),delimiter=';')); assert len(r)==70, len(r); assert len({x['section_id'] for x in r})==7; assert all(x['final_design_status']=='NOT_VERIFIED' and x['arbat_report_status']=='NOT_PROVIDED' for x in r); print('SLS experimental cases:',len(r),'rectangular:',sum(x['section_kind']=='rectangle' for x in r))"
          if ($LASTEXITCODE -ne 0) { throw 'SLS research matrix output validation failed' }
      - name: Independent ARBAT 70-case comparison on stated rectangular geometry
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/cross_section_sls_matrix.py --runner publish/CScorePileRunner.exe --layout arbat_stated --out results/sls_matrix_aligned
          if ($LASTEXITCODE -ne 0) { throw 'ARBAT-stated geometry matrix failed' }
          python -c "import csv; r=list(csv.DictReader(open('results/sls_matrix_aligned/cross_section_sls_matrix.csv',encoding='utf-8-sig'),delimiter=';')); assert len(r)==70; assert all(x['final_design_status']=='NOT_VERIFIED' for x in r); assert all(x['method']=='arbat_conservative' for x in r); print('CScore-based conservative SLS, unresolved:',sum(x['cscore_status']!='research_calculated' for x in r))"
          if ($LASTEXITCODE -ne 0) { throw 'Native CScore SLS provenance failed' }
          python tools/compare_arbat70_crackwidth.py --csv results/sls_matrix_aligned/cross_section_sls_matrix.csv --out results/arbat70_verification
          if ($LASTEXITCODE -ne 0) { throw 'Independent crack-width comparison failed' }
          python -c "import json; j=json.load(open('results/arbat70_verification/arbat70_aligned_metrics.json',encoding='utf-8')); c=j['coverage']; assert c['total']==70 and c['arbat_printed']==27 and c['preliminarily_comparable']>=1; assert j['not_design_approved']; print('ARBAT crack width: printed',c['arbat_printed'],'preliminarily comparable',c['preliminarily_comparable'])"
          if ($LASTEXITCODE -ne 0) { throw 'ARBAT comparison contract failed' }
      - name: Wall cages real-engine checks
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python wall_rebar.py examples/wall_cages.json --runner publish/CScorePileRunner.exe --output results/wall_results.json --csv results/wall_results.csv
          if ($LASTEXITCODE -ne 0) { throw 'Wall cage selection failed' }
          python tools/wall_smoke.py --runner publish/CScorePileRunner.exe
          if ($LASTEXITCODE -ne 0) { throw 'Wall numerical scaling or ULS gate failed' }
      - name: Workbench real-engine project checks
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/workbench_smoke.py --runner publish/CScorePileRunner.exe
          if ($LASTEXITCODE -ne 0) { throw 'Workbench selection or edited reinforcement failed' }
      - name: Native CScore connection cycle on adopted sections
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/connection_smoke.py --runner publish/CScorePileRunner.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native CScore connection cycle failed' }
          python tools/circular_shear_smoke.py --runner publish/CScorePileRunner.exe
          if ($LASTEXITCODE -ne 0) { throw 'Circular equivalent spiral checks failed' }
      - name: Workbench browser interaction checks
        shell: pwsh
        run: |
          npm install --prefix .ui-qa playwright@1.51.1 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency failed' }
          node .ui-qa/node_modules/playwright/cli.js install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { throw 'Browser test runtime failed' }
          $env:NODE_PATH = Join-Path (Get-Location) '.ui-qa/node_modules'
          $env:SCREENSHOT = Join-Path (Get-Location) 'results/workbench-preview.png'
          $env:NATIVE_SCREENSHOT = Join-Path (Get-Location) 'results/workbench-native-checks.png'
          $env:SPIRAL_SCREENSHOT = Join-Path (Get-Location) 'results/workbench-spiral-checks.png'
          $env:CSCORE_RUNNER = Join-Path (Get-Location) 'publish/CScorePileRunner.exe'
          node tools/workbench_browser_check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Workbench browser interaction failed' }
          $env:SECTION_SCREENSHOT = Join-Path (Get-Location) 'results/section-manual.png'
          node tools/section_browser_check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Single-section browser interaction failed' }
          node tools/member_browser_check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Member eccentricity browser interaction failed' }
      - name: Pack deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item publish/* release/ -Recurse
          Copy-Item pile_rebar.py release/
          Copy-Item wall_rebar.py release/
          Copy-Item workbench_app.py release/
          Copy-Item start_workbench.bat release/
          New-Item -ItemType Directory release/workbench -Force | Out-Null
          Copy-Item workbench/*.py release/workbench/
          Copy-Item web release/ -Recurse
          Copy-Item docs/workbench-guide.md release/
          Copy-Item examples/verification/member_length15_manual.json release/
          Copy-Item docs/cscore-connection-cycle.md release/
          New-Item -ItemType Directory release/research -Force | Out-Null
          Copy-Item docs/research/circular-shear-equivalent-section-2026-10-18.md release/research/
          Copy-Item results/workbench release/workbench_results -Recurse
          Copy-Item results/connection release/connection_results -Recurse
          Copy-Item results/circular-shear release/circular_shear_results -Recurse
          Copy-Item results/workbench-preview.png release/
          Copy-Item results/workbench-native-checks.png release/
          Copy-Item results/workbench-spiral-checks.png release/
          Copy-Item results/section-manual.png release/
          Copy-Item examples/wall_cages.json release/
          Copy-Item docs/wall-cage-selection.md release/
          Copy-Item results/wall_smoke release/ -Recurse
          Copy-Item tools/compare_arbat.py release/
          Copy-Item tools/diagnose_arbat_inputs.py release/
          Copy-Item tools/diagnose_arbat_compare.py release/
          Copy-Item tools/arbat_sav_export.py release/
          Copy-Item tools/arbat_v2_benchmark.py release/
          Copy-Item tools/run_crack_research.py release/
          Copy-Item tools/cross_section_sls_matrix.py release/
          Copy-Item tools/compare_arbat70_crackwidth.py release/
          New-Item -ItemType Directory release/config -Force | Out-Null
          Copy-Item config/opencs.lock.json release/config/
          Copy-Item patches release/ -Recurse
          Copy-Item docs/research/phi-n-fix-2026-10-18.md release/research/
          Copy-Item docs/research/phi-fix-data release/research/ -Recurse
          Copy-Item examples/demo_bns.json release/
          Copy-Item examples/geometry_preview.csv release/
          Copy-Item README.md release/
          New-Item -ItemType Directory release/verification -Force | Out-Null
          Copy-Item examples/verification/* release/verification/ -Recurse
          New-Item -ItemType Directory release/diagnostic_forces -Force | Out-Null
          Copy-Item examples/verification/diagnostic_forces/* release/diagnostic_forces/
          Copy-Item results/*.json release/
          Copy-Item results/*.csv release/
          New-Item -ItemType Directory release/diagnostics -Force | Out-Null
          Copy-Item results/diagnostics/* release/diagnostics/
          New-Item -ItemType Directory release/crack_probe -Force | Out-Null
          Copy-Item results/crack_probe/* release/crack_probe/
          New-Item -ItemType Directory release/sls_matrix -Force | Out-Null
          Copy-Item results/sls_matrix/* release/sls_matrix/
          New-Item -ItemType Directory release/sls_matrix_aligned -Force | Out-Null
          Copy-Item results/sls_matrix_aligned/* release/sls_matrix_aligned/
          New-Item -ItemType Directory release/arbat70_verification -Force | Out-Null
          Copy-Item results/arbat70_verification/* release/arbat70_verification/
          Compress-Archive -Path release/* -DestinationPath cscore-pile-windows.zip -Force
      - name: Windows EXE and numerical results
        uses: actions/upload-artifact@v4
        with:
          name: cscore-pile-windows
          path: cscore-pile-windows.zip
          retention-days: 14
      - name: Save diagnostic calculation results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cscore-diagnostic-results
          path: |
            results/connection/*
            results/workbench/*
            results/wall_results.*
            results/wall_smoke/*
            results/pile_results.json
            results/pile_results.csv
            results/P800_*.json
            results/P800_*.csv
            results/P1000_*.json
            results/P1000_*.csv
            results/diagnostics/*.json
            results/diagnostics/*.csv
            results/crack_probe/*.json
            results/crack_probe/*.csv
            results/sls_matrix/*.json
            results/sls_matrix/*.csv
            results/sls_matrix_aligned/*.json
            results/sls_matrix_aligned/*.csv
            results/arbat70_verification/*.csv
            results/arbat70_verification/*.json
          if-no-files-found: ignore
          retention-days: 7
