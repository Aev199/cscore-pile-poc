name: Check upstream CScore updates

# Lightweight weekly check: DOES NOT build or update the verified SHA.
on:
  schedule:
    - cron: '18 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned version metadata
        uses: actions/checkout@v4
      - name: Compare upstream CScore and dependencies with pinned commit
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('config/opencs.lock.json', 'utf8'));
            if (lock.repository !== 'rumata-ap/OpenCS' || !/^[a-f0-9]{40}$/.test(lock.commit)) {
              core.setFailed('Invalid upstream lock: refusing to compare');
              return;
            }
            const [upstreamOwner, upstreamRepo] = lock.repository.split('/');
            const {data} = await github.rest.repos.compareCommits({
              owner: upstreamOwner, repo: upstreamRepo, base: lock.commit, head: lock.branch,
              per_page: 100
            });
            core.info('Pinned SHA: ' + lock.commit);
            core.info('Comparison status: ' + data.status);
            if (data.status === 'identical') {
              core.info('Upstream already matches locked commit.');
              return;
            }
            if (data.status !== 'ahead') {
              core.setFailed('Upstream history diverged from pinned commit: manual evaluation required');
              return;
            }
            const changed = (data.files || []).map(f => f.filename);
            const relevant = changed.filter(p => lock.paths.some(prefix => p.startsWith(prefix)));
            const truncated = changed.length >= 300 || data.total_commits > 250;
            if (relevant.length === 0 && !truncated) {
              core.info('No relevant CScore, tests, CSmath or CSTriangulation changes.');
              return;
            }
            const title = 'OpenCS: changes available beyond pinned CScore version';
            const body = [
              'A newer upstream revision may affect CScore. This is a review request, NOT an automatic upgrade.',
              '',
              '- Pinned commit: ' + lock.commit,
              '- Upstream branch: ' + lock.branch,
              '- Comparison: https://github.com/' + lock.repository + '/compare/' + lock.commit + '...' + lock.branch,
              '- Changed tracked paths (' + relevant.length + '):',
              ...relevant.slice(0, 100).map(p => '  - ' + p),
              truncated ? '\nWARNING: GitHub compare file listing might be truncated; inspect full diff.' : '',
              '',
              'Controlled upgrade checklist:',
              '1. Review source changes and GPL obligations.',
              '2. Make a branch or PR, update the locked upstream commit.',
              '3. Update all pinned-SHA references consistently.',
              '4. Run Python tests, upstream CScore tests, Windows smoke and ARBAT comparisons.',
              '5. Inspect P800/P1000 benchmarks, near-limit P800 T08, and crack-width tests.',
              '6. Merge only after engineering sign-off; production is never auto-updated.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body
                });
                core.info('Updated existing upstream-review issue #' + existing.number);
              } else core.info('Review issue already up to date #' + existing.number);
            } else {
              const {data:created} = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
              core.info('Created upstream review issue #' + created.number);
            }
